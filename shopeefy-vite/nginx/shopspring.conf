# The port the browser used (from its Host header). $server_port would be nginx's own 8080 inside
# the container, not the published one, and the API would build wrong absolute URLs from it.
map $http_host $client_port {
    ~:(?<port>[0-9]+)$  $port;
    default             80;
}

upstream shopspring_api {
    server api:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # ---- API, auth and OAuth2 go to Spring Boot
    # X-Forwarded-For is overwritten with the real peer address, never appended, so a client can't
    # fake its IP to dodge rate limits or the honeytoken block.               [OWASP A01:2025]
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $client_port;
    proxy_hide_header X-Powered-By;

    location /auth/ {
        limit_req zone=edge_auth burst=20 nodelay;
        proxy_pass http://shopspring_api;
    }
    # Only /oauth2/authorization/* is the API's; /oauth2/callback is a page of the web app.
    location ~ ^/(api|oauth2/authorization|login/oauth2|\.well-known|dev/mock-gateway)(/|$) {
        proxy_pass http://shopspring_api;
    }
    # Honeytokens live on the API, so scanners probing these paths are recorded and blocked. [OWASP A09:2025]
    location ~ ^/(\.env|\.git/|wp-login\.php|wp-admin/|phpmyadmin/|actuator/) {
        proxy_pass http://shopspring_api;
    }

    # ---- Single-page app
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    # Security headers for the web app. The API sets its own, stricter ones.  [OWASP A02:2025, A05:2025]
    # script-src has no 'unsafe-inline' and no 'unsafe-eval', so injected markup can't run script.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self'; frame-src https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        try_files $uri /index.html;
    }
}
