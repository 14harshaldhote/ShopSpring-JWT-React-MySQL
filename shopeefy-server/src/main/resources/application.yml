# Default profile = local development. Every secret comes from the environment;          [OWASP A02:2025]
# nothing sensitive is committed. The "prod" profile (application-prod.yml) refuses to
# start if a required secret is missing.

server:
  port: 8080
  error:
    include-stacktrace: never          # no stack traces or exception messages to clients  [OWASP A10:2025]
    include-message: never
  forward-headers-strategy: native     # trust X-Forwarded-* only from Tomcat's internal-proxy ranges
  tomcat:
    max-http-form-post-size: 64KB
    max-swallow-size: 1MB
  servlet:
    session:
      timeout: 10m                     # only the OAuth2 redirect uses a session, for a few seconds
      cookie:
        name: SS_OAUTH
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax                 # must survive the top-level redirect back from the provider

spring:
  application:
    name: shopspring-api
  threads:
    virtual:
      enabled: true                    # Java 25 virtual threads for request handling
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shopspring}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:shopspring_app}
    password: ${DB_PASSWORD:dev-app-password}
    hikari:
      maximum-pool-size: 20
  flyway:
    # Migrations run with a separate DDL-capable account; the app account only has DML rights. [OWASP A05:2025]
    user: ${DB_MIGRATION_USERNAME:${DB_USERNAME:shopspring_app}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:dev-app-password}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50   # loads collections for a whole page in one IN (...) query
        jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  http:
    clients:                            # outbound calls (Razorpay, GitHub, HaveIBeenPwned) can't hang a request [OWASP A10:2025]
      connect-timeout: 3s
      read-timeout: 10s
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  security:
    oauth2:
      client:
        registration: {}                # providers are added from env in OAuth2ClientConfig

management:
  server:
    port: 8081                          # management port is not published through the reverse proxy [OWASP A02:2025]
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

logging:
  level:
    SECURITY_AUDIT: INFO
    org.springframework.security: WARN

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  security:
    jwt:
      issuer: ${JWT_ISSUER:shopspring}
      audience: shopspring-api
      access-token-ttl: 10m
      private-key: ${JWT_PRIVATE_KEY:}  # PKCS#8 PEM, RSA 3072. Dev generates a throwaway key if empty.
    refresh:
      cookie-name: ss_refresh
      cookie-secure: ${COOKIE_SECURE:true}
      token-ttl: 7d
      session-max-age: 30d
    otp:
      pepper: ${OTP_PEPPER:}            # HMAC key for OTP hashes. Dev generates one if empty.
      ttl: 5m
      max-attempts: 5
      resend-cooldown: 60s
      max-sends: 3
    lockout:
      threshold: 5
      observation-window: 15m
      base-duration: 1m                 # doubles on each lockout: 1, 2, 4 ... capped at max-duration
      max-duration: 1h
    password:
      min-length: 10
      max-length: 128
      breach-check: ${PASSWORD_BREACH_CHECK:true}   # HaveIBeenPwned k-anonymity range API
      breach-check-timeout: 2s
    alerts:
      admin-email: ${SECURITY_ALERT_EMAIL:}
    rate-limits:                        # token buckets: capacity, then refill-tokens every refill-period [OWASP A01/A07:2025]
      api:           { capacity: 120, refill-tokens: 120, refill-period: 1m }
      auth:          { capacity: 10,  refill-tokens: 10,  refill-period: 1m }
      refresh:       { capacity: 30,  refill-tokens: 30,  refill-period: 1m }
      otp-email:     { capacity: 5,   refill-tokens: 5,   refill-period: 1h }
      checkout:      { capacity: 5,   refill-tokens: 5,   refill-period: 10m }
      alert-mail:    { capacity: 20,  refill-tokens: 20,  refill-period: 1h }
  mail:
    from: ${MAIL_FROM:ShopSpring <no-reply@shopspring.dev>}
  payment:
    provider: ${PAYMENT_PROVIDER:mock}  # mock | razorpay
    currency: INR
    pending-timeout: 30m                # unpaid orders are cancelled and their stock released
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    mock:
      secret: ${MOCK_PAYMENT_SECRET:}   # dev generates one if empty
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
    devidp:
      client-id: ${DEVIDP_CLIENT_ID:}
      client-secret: ${DEVIDP_CLIENT_SECRET:}
      browser-base-url: ${DEVIDP_BROWSER_URL:http://localhost:9000}
      internal-base-url: ${DEVIDP_INTERNAL_URL:http://localhost:9000}
  seed:
    products: ${SEED_PRODUCTS:true}
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
