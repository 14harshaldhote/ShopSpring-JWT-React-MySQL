# Every push and pull request runs the attack test suite on real MySQL, builds and scans every
# image, starts the whole stack and attacks it end to end.
#
# Supply chain hardening                                                       [OWASP A03:2025]
#  * Third-party actions are pinned to full commit SHAs. A tag can be moved to malicious code
#    (tj-actions/changed-files, March 2025); a commit SHA can't.
#  * The workflow token is read-only and checkout doesn't keep it on disk.
#  * Trivy fails the build on a critical or high CVE that has a fix, and both apps publish a
#    CycloneDX SBOM so any future CVE can be traced to the exact build that shipped it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · attack tests on MySQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopeefy-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Unit, integration and attack tests (Testcontainers MySQL 8.4)
        run: ./mvnw -B -ntp verify
      - name: CycloneDX SBOM
        run: ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom -DoutputFormat=json -DoutputName=sbom-api
      - name: Upload test reports and SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-reports
          path: |
            shopeefy-server/target/surefire-reports/
            shopeefy-server/target/sbom-api.json
          if-no-files-found: ignore

  dev-idp:
    name: Dev OpenID provider · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev-idp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B -ntp package

  web:
    name: Web · lint, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopeefy-vite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: shopeefy-vite/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: No known high or critical vulnerabilities in shipped packages
        run: npm audit --omit=dev --audit-level=high
      - name: CycloneDX SBOM
        run: npm sbom --omit=dev --sbom-format cyclonedx > sbom-web.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-sbom
          path: shopeefy-vite/sbom-web.json

  dependency-scan:
    name: Trivy · dependencies, secrets, Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Resolve Maven dependencies so Trivy sees the full transitive tree
        run: |
          (cd shopeefy-server && ./mvnw -B -ntp -q dependency:go-offline)
          (cd dev-idp && ./mvnw -B -ntp -q dependency:go-offline)
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_OFFLINE_SCAN: true   # resolve poms from the local Maven cache, not Maven Central
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  stack:
    name: Docker stack · end-to-end attack smoke test
    needs: [api, dev-idp, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate throwaway secrets
        run: ./scripts/init-env.sh
      - name: Build and start MySQL, Mailpit, API, dev IdP and nginx
        run: docker compose up --build --detach --wait --wait-timeout 420
      - name: Attack the running stack (OTP, token theft, CSRF, payment forgery, OAuth2 PKCE, honeytoken)
        run: |
          export $(grep -E '^DEVIDP_USER_(EMAIL|PASSWORD)=' .env | xargs)
          python3 scripts/smoke_test.py
      - name: Scan the built images
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: shopspring-api
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan the web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: shopspring-web
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down --volumes
