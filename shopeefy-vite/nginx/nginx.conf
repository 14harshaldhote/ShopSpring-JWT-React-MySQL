# Runs as the unprivileged "nginx" user (see Dockerfile), so no root-only paths.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;                                   # no version in headers or error pages [OWASP A02:2025]
    sendfile on;
    keepalive_timeout 30s;
    client_body_timeout 10s;                             # slow-body (slowloris) protection
    client_header_timeout 10s;
    client_max_body_size 64k;
    access_log /dev/stdout;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Coarse per-IP limit at the edge; the API applies finer token buckets per endpoint.
    limit_req_zone $binary_remote_addr zone=edge_auth:10m rate=30r/m;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
