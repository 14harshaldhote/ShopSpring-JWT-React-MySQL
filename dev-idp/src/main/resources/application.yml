server:
  port: 9000
  servlet:
    session:
      cookie:
        name: DEVIDP_SESSION   # the shop runs on localhost too; distinct names keep the cookies apart

spring:
  application:
    name: dev-idp
  security:
    user:
      name: ${DEVIDP_USER_EMAIL:demo@shopspring.dev}
      password: ${DEVIDP_USER_PASSWORD}
    oauth2:
      authorizationserver:
        issuer: ${DEVIDP_ISSUER:http://localhost:9000}
        client:
          shopspring:
            registration:
              client-id: ${DEVIDP_CLIENT_ID}
              client-secret: "{noop}${DEVIDP_CLIENT_SECRET}"
              client-name: ShopSpring
              client-authentication-methods: client_secret_basic
              authorization-grant-types: authorization_code
              redirect-uris: ${DEVIDP_REDIRECT_URI:http://localhost:8088/login/oauth2/code/devidp}
              scopes: openid,profile,email
            require-proof-key: true
            require-authorization-consent: false
